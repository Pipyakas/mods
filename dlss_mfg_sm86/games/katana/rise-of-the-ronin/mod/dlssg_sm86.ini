; dlssg_sm86 settings for Rise of the Ronin.
; 0.4.0 layout: the proxy DLL, this INI and the dlssg_sm86\ folder (backend,
; runtime, kernel packs, super-resolution) sit beside the rendering EXE.
; The full key list is in externals\dlssg_for_sm86\docs\INSTALL.en.md.

[General]
Enabled=1

[FrameGeneration]
Engine=DLSS
; Cap: 1=2x, 2=3x, 3=4x, 5=6x.
MaxGeneratedFrames=3

[DLSSG]
; 0=stock kernels, 1=lossless optimization, 2/3=faster lossy optimization.
Optimized=3
; C = FG Lite (about 32-54% less GPU time per generated frame, slightly lower
; image quality on HUD / occlusion edges). Auto = neutral.
Preset=C

[Logging]
; 0=off, 1=errors, 2=configuration, 3=detailed runtime samples.
Level=3
Directory=dlssg_sm86\logs

[Runtime]
Mode=Bundled

[SuperResolution]
; INT8 super-resolution (RTX 30 / 20): the game's own L / M preset modes run
; this project's INT8 kernels.
Mode=On
