; ACE COMBAT 8 bootstrap -- edit this file, then restart the game.
; start_protected_game.exe syncs [ConsoleVariables] into Engine.ini and
; [SM86.*] into Game\Binaries\Win64\dlssg_sm86.ini before launching the game.
; Frame generation MODE (Dynamic / refresh-based / off) is not set here: it is
; in Game\Binaries\Win64\dlss_mfg_sm86.ini, read by the dlss_mfg_sm86 proxy DLL.
; Keep inline comments on separate lines. Use key=@remove to delete a synced key.

[Launcher]
; Fix the game's off-by-one DLSS quality preset mapping in memory.
FixDLSSPresets=1
; Keeps in-game DLSS presets free of a fixed render-scale override.
RemoveScreenPercentage=1
; Let UE dynamic resolution work (the game's renderer never reports support
; for it), e.g. for dlss_mfg_sm86 Mode 3 with DynamicResolution=1. Needs DLSS
; Performance or higher in game: Ultra Performance is a fixed resolution.
EnableDynamicResolution=1
LockEngineIni=1
; Offline mode (this launcher starts the game without Easy Anti-Cheat); done by
; a module this exe carries and maps into the game (no extra file).
; Skip the logo/notice screens and the title screen; main menu without fade-in.
SkipIntro=1
; ACE COMBAT ONLINE and ACE COMBAT STORE can't be used offline: hide them.
HideOnlineMenu=1

[Debug]
; Load UE4SS (Game\Binaries\Win64\ue4ss\UE4SS.dll) into the game, for mod work.
UE4SS=0
; Let a tool drive the game in the background through \\.\pipe\ac8_agent
; (keys, mouse, pad; the game keeps believing it is in front), for mod work.
AgentControl=0

[ConsoleVariables]
; Add other UE CVars here as needed; existing unrelated Engine.ini keys survive.
r.Streamline.InitializePlugin=1
; Keep at 1: the Frame Generation row that dlss_mfg_sm86 adds to Settings >
; Graphics turns it off and on. 0=off, 1=on, 2=legacy auto (Streamline's older auto, NOT Dynamic MFG).
r.Streamline.DLSSG.Enable=1
; Fixed generated-frame count the game requests: 1=2x, 2=3x, 3=4x.
; Unused with dlss_mfg_sm86 (any Mode): its Frame Generation row or INI decides.
r.Streamline.DLSSG.FramesToGenerate=3
; 0=off, 1=low latency, 2=low latency + boost.
t.Streamline.Reflex.Mode=2

[SM86.General]
Enabled=1

[SM86.FrameGeneration]
Engine=DLSS
; Cap: 1=2x, 2=3x, 3=4x, 5=6x (requires matching runtime/integration).
MaxGeneratedFrames=3

[SM86.DLSSG]
; 0=stock kernels, 1=lossless optimization, 2/3=faster lossy optimization.
Optimized=3
; C = FG Lite (about 32-54% less GPU time per generated frame, slightly lower
; image quality on HUD / occlusion edges). Auto = neutral.
Preset=C

[SM86.SuperResolution]
; INT8 super-resolution (RTX 30 / 20): the game's own L / M preset modes run
; this project's INT8 kernels.
Mode=On

[SM86.Logging]
; Mod logging: 0=off, 1=errors, 2=configuration, 3=detailed runtime samples.
Level=3
; Relative to the SM86 proxy DLL directory.
Directory=dlssg_sm86\logs

[SM86.Runtime]
Mode=Bundled
